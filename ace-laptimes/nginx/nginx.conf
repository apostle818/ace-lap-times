server {
    listen 80;
    server_name _;

    # The API takes small JSON documents; the backend caps bodies too. This
    # stops an oversized upload before it reaches the application at all.
    client_max_body_size 256k;

    # Don't advertise the exact nginx version in responses and error pages.
    server_tokens off;

    # ── Security headers ────────────────────────────────────────────
    #
    # Applied to every response via `always`, so they are present on error
    # pages too. Repeated in both locations because add_header does not
    # inherit into a block that sets its own headers.
    #
    # The CSP is the important one. script-src is 'self' with no
    # 'unsafe-inline': the page's JavaScript lives in app.js and Chart.js is
    # served from /vendor, so nothing inline and nothing third-party may run.
    # style-src still needs 'unsafe-inline' because the markup uses inline
    # style attributes throughout; that is a much narrower exposure than
    # inline script. connect-src 'self' means an injection cannot exfiltrate
    # to an outside origin, and frame-ancestors 'none' blocks clickjacking.
    set $alt_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'";

    # API requests -> backend
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Content-Security-Policy $alt_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # API responses are never a page and must never be cached by proxies.
        add_header Cache-Control "no-store" always;
    }

    # Everything else -> frontend
    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Content-Security-Policy $alt_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        # Always revalidate HTML so browsers pick up new deployments immediately
        add_header Cache-Control "no-cache, must-revalidate" always;

        # Uncomment once the stack is behind TLS — see docs/TLS.md. Sending
        # HSTS over plain HTTP does nothing, and sending it from a hostname
        # you later want to serve over HTTP is hard to undo in browsers.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
