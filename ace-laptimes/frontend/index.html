<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALT — Assetto Corsa Evo Lap Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23e63946'/><stop offset='1' stop-color='%23ff6b6b'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><g fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12.5 4 H19.5'/><path d='M16 4 V9.4'/><path d='M22.6 9.4 L24.4 7.6'/><circle cx='16' cy='18' r='8.6'/><path d='M16 18 L19.6 14.4'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Chart.js is vendored into the image at build time rather than pulled
     from a CDN, so the page loads no third-party script and the CSP can
     stay at script-src 'self'. See frontend/Dockerfile. -->
<script src="/vendor/chart.umd.js" defer></script>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #1a1a26;
  --bg-card-hover: #22222f;
  --bg-input: #14141e;
  --border: #2a2a3a;
  --border-focus: #e63946;
  --text-primary: #eaeaf0;
  --text-secondary: #8888a0;
  --text-muted: #55556a;
  --accent: #e63946;
  --accent-glow: rgba(230, 57, 70, 0.3);
  --accent-soft: rgba(230, 57, 70, 0.12);
  --green: #2ec866;
  --green-soft: rgba(46, 200, 102, 0.12);
  --yellow: #f4a623;
  --yellow-soft: rgba(244, 166, 35, 0.12);
  --blue: #4a9eff;
  --blue-soft: rgba(74, 158, 255, 0.12);
  --purple: #a855f7;
  --purple-soft: rgba(168, 85, 247, 0.12);
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
  --font: 'Outfit', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 240px; background: var(--bg-secondary); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: fixed;
  top: 0; left: 0; bottom: 0; z-index: 100; transition: transform 0.3s ease;
}

.main-content { flex: 1; margin-left: 240px; padding: 32px 40px; max-width: 1200px; }

.logo-area { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); }
.logo-area h1 {
  font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
  background: linear-gradient(135deg, var(--accent), #ff6b6b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-area .subtitle { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; margin-top: 6px; }

/* ── ALT brand lockup ── */
.brand-lockup { display: inline-flex; align-items: center; gap: 11px; }
.logo-mark {
  width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--accent), #ff6b6b);
  box-shadow: 0 4px 16px var(--accent-glow);
}
.logo-mark svg { width: 23px; height: 23px; display: block; }
.logo-mark path { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.brand-word {
  font-family: 'Outfit', sans-serif; font-weight: 900; letter-spacing: 3px; font-size: 21px; line-height: 1;
  background: linear-gradient(135deg, var(--accent), #ff6b6b);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.brand-lg { justify-content: center; }
.brand-lg .logo-mark { width: 46px; height: 46px; border-radius: 12px; }
.brand-lg .logo-mark svg { width: 31px; height: 31px; }
.brand-lg .brand-word { font-size: 31px; letter-spacing: 4px; }

.nav-section { padding: 16px 12px; flex: 1; overflow-y: auto; }
.nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); padding: 0 8px; margin-bottom: 8px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; font-weight: 500;
  color: var(--text-secondary); transition: all 0.15s ease; margin-bottom: 2px;
}
.nav-item:hover { background: var(--bg-card); color: var(--text-primary); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

.user-area { padding: 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
}
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.user-logout { font-size: 11px; color: var(--text-muted); cursor: pointer; transition: color 0.15s; margin-top: 2px; }
.user-logout:hover { color: var(--accent); }

.role-badge {
  display: inline-flex; align-items: center; font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.8px; padding: 2px 6px; border-radius: 4px; white-space: nowrap;
}
.role-badge.superadmin { background: var(--purple-soft); color: var(--purple); }
.role-badge.group-admin { background: var(--blue-soft); color: var(--blue); }
.role-badge.member { background: rgba(85,85,106,0.2); color: var(--text-muted); }

.page-header { margin-bottom: 28px; }
.page-header h2 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.page-header p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
.page-header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.page-header-row > .page-header-text { min-width: 0; }
.page-refresh-btn {
  flex-shrink: 0; width: 38px; height: 38px; padding: 0;
  border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-secondary); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.15s ease;
}
.page-refresh-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--text-muted); }
.page-refresh-btn:disabled { opacity: 0.6; cursor: wait; }
.page-refresh-btn svg { width: 18px; height: 18px; transition: transform 0.2s ease; }
.page-refresh-btn:hover svg { transform: rotate(45deg); }
.page-refresh-btn.spinning svg { animation: refresh-spin 0.8s linear infinite; }
.page-refresh-btn.spinning:hover svg { transform: none; }
@keyframes refresh-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.card-title { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); }
.form-group input, .form-group select, .form-group textarea {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text-primary); font-family: var(--font); font-size: 14px; padding: 10px 12px; outline: none; transition: border-color 0.15s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
}
.form-group input:disabled { opacity: 0.5; cursor: not-allowed; }
.form-group select { cursor: pointer; }
.form-group select option { background: var(--bg-card); }
.form-group textarea { resize: vertical; min-height: 80px; }

.laptime-inputs { display: flex; gap: 6px; align-items: center; }
.laptime-inputs input { flex: 1; min-width: 44px; max-width: 80px; text-align: center; font-family: var(--mono); font-size: 15px; font-weight: 600; }
.laptime-sep { color: var(--text-muted); font-family: var(--mono); font-weight: 700; font-size: 18px; flex-shrink: 0; }

.btn {
  padding: 10px 20px; border-radius: var(--radius-sm); border: none; cursor: pointer;
  font-family: var(--font); font-size: 13px; font-weight: 600; transition: all 0.15s ease;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: #d42f3c; box-shadow: 0 4px 16px var(--accent-glow); }
.btn-secondary { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-card-hover); color: var(--text-primary); }
.btn-ghost { background: transparent; color: var(--text-secondary); padding: 6px 10px; }
.btn-ghost:hover { color: var(--accent); }
.btn-danger { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(230,57,70,0.3); }
.btn-danger:hover { background: var(--accent); color: white; }
.btn-sm { padding: 6px 12px; font-size: 12px; }

.data-table { width: 100%; border-collapse: collapse; }
.data-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; }
.data-table td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid rgba(42,42,58,0.5); vertical-align: middle; }
.data-table tr:hover td { background: rgba(255,255,255,0.02); }
.laptime-cell { font-family: var(--mono); font-weight: 600; font-size: 14px; letter-spacing: 0.5px; }
.pb-badge { display: inline-block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; background: var(--green-soft); color: var(--green); }
.weather-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 8px; border-radius: 4px; background: var(--bg-input); color: var(--text-secondary); }
.driver-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.driver-dot { width: 8px; height: 8px; border-radius: 50%; }
.delete-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 8px; border-radius: 4px; transition: all 0.15s; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; min-width: 36px; min-height: 36px; }
.delete-btn:hover { color: var(--accent); background: var(--accent-soft); }

.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 6px; }
.stat-value { font-family: var(--mono); font-size: 22px; font-weight: 700; }
.stat-value.accent { color: var(--accent); }
.stat-value.green { color: var(--green); }
.stat-value.blue { color: var(--blue); }

.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.filter-bar select, .filter-bar input { background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-family: var(--font); font-size: 13px; padding: 8px 12px; outline: none; }
.filter-bar select option { background: var(--bg-card); }

.lb-position { font-family: var(--mono); font-weight: 800; font-size: 16px; width: 32px; text-align: center; }
.lb-position.gold { color: #ffd700; }
.lb-position.silver { color: #c0c0c0; }
.lb-position.bronze { color: #cd7f32; }
.lb-diff { font-family: var(--mono); font-size: 12px; color: var(--accent); }

.login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-primary); position: relative; overflow: hidden; padding: 16px; }
.login-wrapper::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle at 30% 40%, var(--accent-glow) 0%, transparent 50%), radial-gradient(circle at 70% 60%, rgba(74,158,255,0.08) 0%, transparent 50%);
  animation: loginGlow 8s ease-in-out infinite alternate;
}
@keyframes loginGlow { 0% { transform: translate(0,0); } 100% { transform: translate(-3%,-3%); } }
.login-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px; width: min(380px, 100%); position: relative; box-shadow: var(--shadow); }
.login-box h1 { font-size: 24px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; text-align: center; background: linear-gradient(135deg, var(--accent), #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
.login-box .login-sub { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 28px; letter-spacing: 0.5px; }
.login-box .form-group { margin-bottom: 16px; }
.login-box .form-group input { width: 100%; }
.login-box .btn-primary { width: 100%; justify-content: center; padding: 12px; font-size: 14px; margin-top: 8px; }
.login-toggle { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-secondary); }
.login-toggle a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 600; }

.error-msg { background: var(--accent-soft); color: var(--accent); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; }
.success-msg { background: var(--green-soft); color: var(--green); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; }

.chart-container { position: relative; height: 300px; }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-state svg { margin-bottom: 16px; opacity: 0.3; }
.empty-state h3 { font-size: 16px; color: var(--text-secondary); margin-bottom: 6px; }
.empty-state p { font-size: 13px; }

.group-card { display: flex; align-items: center; gap: 16px; padding: 16px 20px; margin-bottom: 12px; }
.group-card-info { flex: 1; }
.group-card-name { font-weight: 700; font-size: 15px; }
.group-card-meta { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
.group-card-desc { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
.group-card-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

.inline-select { background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-family: var(--font); font-size: 12px; padding: 4px 8px; outline: none; cursor: pointer; }
.inline-select option { background: var(--bg-card); }

.pagination { display: flex; align-items: center; gap: 12px; justify-content: space-between; padding-top: 16px; flex-wrap: wrap; }
.pagination-info { font-size: 12px; color: var(--text-muted); }
.pagination-nav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.pagination-size { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
.page-btn {
  min-width: 32px; height: 32px; padding: 0 10px;
  border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-secondary); cursor: pointer; font-size: 13px; font-weight: 500;
  font-family: var(--font); transition: all 0.15s ease;
  display: inline-flex; align-items: center; justify-content: center;
}
.page-btn:hover:not(:disabled) { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--text-muted); }
.page-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.page-ellipsis { color: var(--text-muted); padding: 0 4px; font-size: 13px; user-select: none; }
@media (max-width: 600px) {
  .pagination { justify-content: center; }
  .pagination-info { order: 3; width: 100%; text-align: center; }
}

.invite-banner { background: var(--blue-soft); border: 1px solid rgba(74,158,255,0.3); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 20px; font-size: 13px; color: var(--blue); }

/* Connected-client status badges */
.client-status {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  padding: 3px 8px; border-radius: 999px;
}
.client-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
.client-status.online       { background: var(--green-soft);  color: var(--green); }
.client-status.online::before       { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 1.6s ease-in-out infinite; }
.client-status.idle         { background: var(--yellow-soft); color: var(--yellow); }
.client-status.idle::before         { background: var(--yellow); }
.client-status.lost         { background: var(--accent-soft); color: var(--accent); }
.client-status.lost::before         { background: var(--accent); }
.client-status.disconnected { background: rgba(85,85,106,0.2); color: var(--text-muted); }
.client-status.disconnected::before { background: var(--text-muted); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
tr.client-row.lost td { background: rgba(230,57,70,0.04); }
tr.client-row.disconnected td { color: var(--text-muted); }

.mobile-toggle { display: none; }

/* ─── Sidebar backdrop ─── */
.sidebar-backdrop {
  display: none; position: fixed; inset: 0; z-index: 99;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
}
.sidebar-backdrop.visible { display: block; }

/* ─── Bottom navigation ─── */
.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg-secondary); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.bottom-nav-items { display: flex; height: 60px; }
.bottom-nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; color: var(--text-muted); font-size: 10px; font-weight: 600;
  letter-spacing: 0.3px; text-transform: uppercase; transition: color 0.15s;
  -webkit-tap-highlight-color: transparent; user-select: none; padding: 8px 4px;
}
.bottom-nav-item svg { width: 20px; height: 20px; }
.bottom-nav-item.active { color: var(--accent); }
.bottom-nav-item:active { opacity: 0.7; }

/* ─── Overlay backdrop (more sheet) ─── */
.overlay-backdrop {
  display: none; position: fixed; inset: 0; z-index: 199;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
}
.overlay-backdrop.visible { display: block; }

/* ─── More sheet ─── */
.more-sheet {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: var(--bg-secondary); border-top: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0) + 8px);
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
}
.more-sheet.open { transform: translateY(0); }
.more-sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 12px auto 4px; }
.more-sheet-user {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px 16px; border-bottom: 1px solid var(--border);
}
.more-sheet-user-info { flex: 1; min-width: 0; }
.more-sheet-user-name { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.more-sheet-user-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.more-sheet-signout {
  font-size: 12px; color: var(--text-muted); cursor: pointer; transition: color 0.15s;
  padding: 6px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: none; font-family: var(--font);
}
.more-sheet-signout:hover { color: var(--accent); }
.more-sheet-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); padding: 12px 20px 4px; }
.more-sheet-item {
  display: flex; align-items: center; gap: 14px; padding: 13px 20px; cursor: pointer;
  color: var(--text-secondary); font-size: 15px; font-weight: 500; transition: background 0.1s;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.more-sheet-item svg { width: 20px; height: 20px; flex-shrink: 0; }
.more-sheet-item:active { background: var(--bg-card); }
.more-sheet-item.active { color: var(--accent); background: var(--accent-soft); }

/* ─── Table → card layout on small screens ─── */
@media (max-width: 600px) {
  .table-scroll { overflow-x: visible; }
  .data-table thead { display: none; }
  .data-table tbody tr {
    display: block; margin-bottom: 10px;
    background: var(--bg-card-hover); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 4px 0;
  }
  .data-table td {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(42,42,58,0.4);
    padding: 10px 14px; font-size: 13px; min-height: 44px;
  }
  .data-table td:last-child { border-bottom: none; }
  .data-table td[data-label]::before {
    content: attr(data-label); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted);
    flex-shrink: 0; margin-right: 12px;
  }
  .data-table td:empty { display: none; }
  .data-table tr:hover td { background: transparent; }
}

/* ─── Mobile ≤768px ─── */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .main-content { margin-left: 0; padding: 20px 16px 84px; }
  .form-grid { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  .bottom-nav { display: block; }
  .form-group input, .form-group select, .form-group textarea { font-size: 16px; }
  .filter-bar select, .filter-bar input { font-size: 16px; }
  .chart-container { height: 220px; }
  .page-header h2 { font-size: 22px; }
  .login-box { padding: 28px 20px; }
  .btn-sm { min-height: 36px; }
}

/* ─── Small phones ≤480px ─── */
@media (max-width: 480px) {
  .main-content { padding-left: 12px; padding-right: 12px; }
  .card { padding: 16px 14px; }
  .stat-value { font-size: 20px; }
  .group-card { flex-direction: column; align-items: flex-start; }
  .group-card-actions { width: 100%; justify-content: flex-start; }
  .page-header h2 { font-size: 20px; }
  .login-box { padding: 24px 14px; }
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease forwards; }
.table-scroll { overflow-x: auto; }
</style>
</head>
