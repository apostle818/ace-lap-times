name: Build tray app

# Packages the Windows tray app into a standalone .exe with PyInstaller.
#
#   tag v*        -> builds, then a second job attaches ACELapTracker.exe to
#                    the GitHub release
#   pull request  -> builds only, uploaded as a workflow artifact
#   manual        -> workflow_dispatch, artifact only
#
# The exe bundles its own Python, so end users no longer need Python
# installed to run the tray app (start.bat remains for running from source).
#
# Two jobs on purpose: `build` (Windows, to actually run PyInstaller) never
# holds a write-scoped token, since it runs on every pull request; `release`
# (Linux, it only shells out to `gh`) holds contents: write but is gated to
# tag pushes, so that token is never minted for a PR run.

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths: ['ace-tray/**', '.github/workflows/tray-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tray-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # No contents: write here - this job runs on every pull request too
    # (including, potentially, one from a fork), and it only ever builds and
    # uploads a workflow artifact. Only the release job below, gated to tag
    # pushes, needs write access to attach the exe to a GitHub release.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ace-tray/requirements.txt

      - name: Install dependencies
        working-directory: ace-tray
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      # keyring finds its backends through package entry points, so a bundle
      # without keyring's metadata silently falls back to storing the API key
      # in the registry. Fail here instead, on the same Windows runner.
      - name: Check credential store backend
        shell: bash
        run: |
          python -c "import keyring; from keyring.backends.Windows import WinVaultKeyring as W; k = keyring.get_keyring(); print(k); assert isinstance(k, W), k"

      # The tray icon is drawn at runtime with QPainter (create_app_icon in
      # ace_tray.py), so there are no data files to bundle - just the script.
      # The keyring flags carry the metadata and Windows backend the check
      # above relies on into the exe.
      - name: Build executable
        working-directory: ace-tray
        run: |
          pyinstaller --onefile --windowed `
            --name ACELapTracker `
            --hidden-import PyQt6.QtSvg `
            --copy-metadata keyring `
            --hidden-import keyring.backends.Windows `
            ace_tray.py

      - name: Smoke-test the executable
        working-directory: ace-tray
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/ACELapTracker.exe
          size=$(stat -c%s dist/ACELapTracker.exe)
          echo "Built ACELapTracker.exe (${size} bytes)"
          # A PyQt6 onefile bundle is tens of MB; anything tiny means the
          # build silently produced a stub.
          if [[ "$size" -lt 10000000 ]]; then
            echo "::error::Executable is implausibly small (${size} bytes)"
            exit 1
          fi

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          app=$(grep -oP 'APP_VERSION\s*=\s*"\K[^"]+' ace-tray/ace_tray.py)
          if [[ "$tag" != "$app" ]]; then
            echo "::warning::Tag is v${tag} but APP_VERSION in ace_tray.py is ${app}"
          else
            echo "Version matches: ${app}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ACELapTracker-exe
          path: ace-tray/dist/ACELapTracker.exe
          if-no-files-found: error

  # Separate job, gated to tag pushes only, so the contents: write token
  # this needs (to attach the exe to a release) is never minted for a pull
  # request or workflow_dispatch run - those stop at `build` above with a
  # read-only token.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach the exe to a release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ACELapTracker-exe
          path: dist

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/ACELapTracker.exe --clobber
          else
            gh release create "$tag" dist/ACELapTracker.exe \
              --title "$tag" --generate-notes
          fi
